<!DOCTYPE html>
<html>
  <head>
    <title>Ejemplo de imagen y PDF en una página HTML</title>
  </head>
  <body>
    <h1>Una imagen y un archivo PDF en una página HTML</h1>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7s32G1zspM04gzfp7jxZMRqbEkPSdJkAtc_OVjA-9yw&s=10" alt="Imagen de ejemplo" width="400">
    <p>Esta es una imagen de ejemplo.</p>
    <embed src="archivo.pdf" width="500" height="700" type='application/pdf'>
    <p>Este es un archivo PDF de ejemplo.</p>
  </body>
</html>
